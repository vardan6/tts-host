<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TTS Host Selection Reader</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 2rem; max-width: 32rem; }
      label { display: block; margin: 1rem 0 .35rem; }
      input { width: 8rem; padding: .35rem; }
      button { margin-top: 1rem; padding: .4rem .8rem; }
      #status { min-height: 1.4rem; }
    </style>
  </head>
  <body>
    <h1>TTS Host Selection Reader</h1>
    <label for="port">Host port</label>
    <input id="port" type="number" min="1" max="65535" step="1">
    <button id="save" type="button">Save</button>
    <p id="status" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
